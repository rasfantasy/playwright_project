name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# По умолчанию — минимальные права; запись нужна только джобе публикации отчёта
permissions:
  contents: read

jobs:
  test:
    name: Typecheck & Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Тесты идут в официальном образе Playwright той же версии, что в package.json.
    # Это гарантирует идентичный рендеринг с эталонными скриншотами (*-chromium-linux.png),
    # которые генерируются локально в этом же образе (npm run snapshots:update).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --strict)
        run: npm run typecheck

      # Без --update-snapshots и без continue-on-error:
      # упавший тест (в т.ч. визуальная регрессия) роняет пайплайн
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      # HTML-отчёт Playwright с diff-картинками, трейсами и видео — только при падении
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  report:
    name: Publish Allure Report
    needs: test
    # Отчёт публикуется и при упавших тестах, но только для push (не для PR)
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Не даём двум деплоям одновременно писать в gh-pages
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # История прошлых прогонов (тренды в Allure) из ветки gh-pages
      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure Report
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
